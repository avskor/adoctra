name: checks
on:
  push:
  pull_request:
  # A weekly and a manual run verify every Ruby reference again, without the
  # cache of already verified ones.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REFERENCE_CACHE_FLAG: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--no-reference-cache' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WASM bindings
        run: cargo check --locked -p adoctra-wasm --target wasm32-unknown-unknown
      - name: Build CLI
        run: cargo build -p adoctra-cli
      - name: Test compatibility harness
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Performance harness smoke (no timing thresholds)
        run: python3 scripts/performance.py --smoke --samples 1 --iterations 1 --warmup 0 --skip-wasm
      - name: Fuzz robustness smoke (editor path; fixed seeds, no Ruby)
        run: |
          for seed in 1 2 3; do
            python3 scripts/fuzz.py --stage robust --seed "$seed" --count 1500 --depths 8,64,128,2048 --report "target/fuzz/robust-$seed.json"
          done
      - name: Offline compatibility corpus
        run: python3 scripts/compatibility.py
      - name: Offline acceptance corpus and diagnostics
        run: python3 scripts/acceptance.py --json-report target/acceptance-report.json
      - name: Offline document structure
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/structure.json --json-report target/structure-report.json
      - name: Offline upstream tests
        run: python3 scripts/acceptance.py --manifest compatibility/upstream/cases.json --json-report target/upstream-report.json
      - name: Offline inline semantics and attributes
        run: python3 scripts/acceptance.py --manifest compatibility/upstream/semantics.json --json-report target/semantics-report.json
      - name: Offline real document semantics
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/semantics.json --json-report target/document-semantics-report.json
      - name: Offline diagnostic positions
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/positions.json --json-report target/positions-report.json
      - name: Offline Rouge highlighting of real documents
        run: python3 scripts/rouge_listings.py --json-report target/rouge-listings-report.json
      - name: Install pinned Ruby reference
        run: gem install --user-install asciidoctor --version "$(cat compatibility/asciidoctor-version)" --no-document
      - name: Install pinned URI cache reference
        run: gem install --user-install open-uri-cached --version "$(cat compatibility/open-uri-cached-version)" --no-document
      # Keys of references already verified with Ruby (scripts/compatibility.py,
      # scripts/rouge_listings.py). Each key covers the Ruby environment, the
      # case's inputs and its stored reference, so any earlier cache is safe
      # to restore: entries that no longer match simply run Ruby again.
      - name: Restore verified Ruby references
        uses: actions/cache@v4
        with:
          path: target/reference-cache
          key: reference-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: reference-cache-${{ runner.os }}-
      - name: Install pinned Rouge reference
        run: gem install --user-install rouge --version "$(cat compatibility/rouge-version)" --no-document
      - name: Verify generated Rouge tables, lexers and conformance corpora
        run: |
          ruby --version
          ruby scripts/generate_rouge.rb unicode | diff - crates/adoctra-highlight/src/regex/unicode_tables.rs
          ruby scripts/generate_rouge.rb regex-corpus | diff - crates/adoctra-highlight/tests/data/regex_corpus.txt
          ruby scripts/generate_rouge.rb tokens | diff - crates/adoctra-highlight/src/generated/tokens.rs
          ruby scripts/generate_rouge.rb themes | diff - crates/adoctra-highlight/src/generated/themes.rs
          ruby scripts/generate_rouge.rb lexers | diff - crates/adoctra-highlight/src/generated/lexers.rs
          ruby scripts/generate_rouge.rb lexer-corpus | diff - crates/adoctra-highlight/tests/data/lexer_corpus.txt
      - name: Differential audit of the upstream test suite inputs
        run: python3 scripts/upstream_audit.py --baseline compatibility/upstream/audit/report.json
      - name: Compare the CLI with Ruby's command
        run: python3 scripts/cli_matrix.py --baseline compatibility/cli/report.json --report target/cli-report.json
      - name: Verify URI cache requests and diagnostics
        run: python3 scripts/audit_uri_cache.py --baseline compatibility/uri-cache/report.json --report target/uri-cache-report.json
      - name: Verify URI asset cache and known conversion order gaps
        run: python3 scripts/audit_uri_cache.py --assets --baseline compatibility/uri-cache/assets.json --report target/uri-assets-report.json
      - name: Test semantic reference converter
        run: ruby scripts/test_asciidoctor_semantics.rb
      - name: Test diagnostic position reference
        run: ruby scripts/test_asciidoctor_positions.rb
      - name: Verify reference fixtures and compatibility
        run: python3 scripts/compatibility.py --verify-reference $REFERENCE_CACHE_FLAG
      - name: Verify acceptance references and diagnostics
        run: python3 scripts/acceptance.py --verify-reference
      - name: Verify document structure references
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/structure.json --verify-reference
      - name: Verify upstream test references
        run: python3 scripts/acceptance.py --manifest compatibility/upstream/cases.json --verify-reference
      - name: Verify inline semantics and attribute references
        run: python3 scripts/acceptance.py --manifest compatibility/upstream/semantics.json --verify-reference
      - name: Verify real document semantic references
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/semantics.json --verify-reference
      - name: Verify diagnostic position references
        run: python3 scripts/acceptance.py --manifest compatibility/acceptance/positions.json --verify-reference
      - name: Verify Rouge listing references
        run: python3 scripts/rouge_listings.py --verify-reference $REFERENCE_CACHE_FLAG
