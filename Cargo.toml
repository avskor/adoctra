[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adoctra/adoctra"
authors = ["Alexey"]
description = "An AsciiDoc processor and publishing toolchain, written in Rust"

# Internal crates are wired via path + version so the same manifests work
# both inside the workspace and when published to crates.io.
[workspace.dependencies]
adoctra      = { path = "crates/adoctra",      version = "0.1.0" }
adoctra-core = { path = "crates/adoctra-core", version = "0.1.0" }
adoctra-html = { path = "crates/adoctra-html", version = "0.1.0" }
adoctra-docx = { path = "crates/adoctra-docx", version = "0.1.0" }
adoctra-json = { path = "crates/adoctra-json", version = "0.1.0" }
adoctra-highlight = { path = "crates/adoctra-highlight", version = "0.1.0" }

# The CLI's clock and local time zone for Ruby's date attributes (core reads
# no clock).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The CLI's reader for URIs (`allow-uri-read` includes and stylesheets).
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

# The DOCX backend's package reader/writer: zip with flate2's pure-Rust
# (miniz_oxide) deflate, no C code and no other codecs.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# Third-party deps you'll likely want later (kept out of the scaffold; only
# the CLI's clock and URI reader use external crates). Uncomment + `cargo add` as needed:
# thiserror = "2"
# clap      = { version = "4", features = ["derive"] }
# serde     = { version = "1", features = ["derive"] }
# serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# The regexp engine's conformance corpus (thousands of patterns at every
# position of the Rouge demos) is too slow unoptimized.
[profile.test.package.adoctra-highlight]
opt-level = 2

# `unsafe` is forbidden in every crate (user decision 2026-10-31; see CLAUDE.md).
[workspace.lints.rust]
unsafe_code = "forbid"
