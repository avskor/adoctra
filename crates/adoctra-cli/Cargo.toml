[package]
name = "adoctra-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line AsciiDoc processor (the `adoctra` binary)"

[[bin]]
name = "adoctra"
path = "src/main.rs"

[dependencies]
adoctra = { workspace = true, features = ["all-backends"] }
adoctra-ext-diagram = { workspace = true }
chrono = { workspace = true }
ureq = { workspace = true }
# Swap the hand-rolled arg parsing in main.rs for clap when you outgrow it:
# clap = { workspace = true }

[lints]
workspace = true
