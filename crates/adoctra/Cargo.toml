[package]
name = "adoctra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "An AsciiDoc processor and publishing toolchain, written in Rust"
readme = "../../README.adoc"
keywords = ["asciidoc", "parser", "converter", "html", "docx"]
categories = ["text-processing"]

[features]
default = ["html"]
html = ["dep:adoctra-html"]
docx = ["dep:adoctra-docx"]
json = ["dep:adoctra-json"]
all-backends = ["html", "docx", "json"]

[dependencies]
adoctra-core = { workspace = true }
adoctra-html = { workspace = true, optional = true }
adoctra-docx = { workspace = true, optional = true }
adoctra-json = { workspace = true, optional = true }
