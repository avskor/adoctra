<div class="paragraph">
<p>Press <span class="keyseq"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd></span> or <kbd>F11</kbd>, then <span class="keyseq"><kbd>Ctrl</kbd>+<kbd>,</kbd></span> and <span class="keyseq"><kbd><strong>Alt</strong></kbd>+<kbd>&lt;</kbd></span>. Click
<b class="button">Save</b> and choose <span class="menuseq"><b class="menu">File</b>&#160;<b class="caret">&#8250;</b> <b class="submenu">Export</b>&#160;<b class="caret">&#8250;</b> <b class="menuitem">PDF</b></span>, <span class="menuseq"><b class="menu">View</b>&#160;<b class="caret">&#8250;</b> <b class="submenu">Zoom</b>&#160;<b class="caret">&#8250;</b> <b class="menuitem">Reset</b></span> or
<b class="menuref">Tools</b>. The shorthand <span class="menuseq"><b class="menu">Edit</b>&#160;<b class="caret">&#8250;</b> <b class="menuitem">Copy</b></span> works too; kbd:[x] and menu:A[B] stay text.</p>
</div>
